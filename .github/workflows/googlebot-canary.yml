# Fails loudly if Google reports that it was BLOCKED when it last crawled us.
#
# WHY THIS EXISTS:
# Cloudflare returned HTTP 403 to Googlebot for roughly five days
# (2026-07-31 to 2026-08-04, measured 2026-09-08). Five state hubs were still
# frozen in Google's index as "Blocked due to access forbidden (403)" weeks
# later and had to be re-submitted by hand. Nothing caught it while it was
# happening: the sitemap stayed Valid with 0 errors, check:drift stayed green,
# CI stayed green, and the site returned 200 to every request we made
# ourselves. Every signal we had was measuring the wrong thing — none of them
# asked what GOOGLE saw. Cloudflare has 403'd Googlebot on this property
# before (s94), so this is a recurring failure mode, not a one-off.
#
# WHY A SEPARATE WORKFLOW, NOT A STEP IN ci.yml:
# The thing being measured is production's behaviour toward a third party. It
# has nothing to do with the contents of any PR, and it can go red on a day
# when nobody pushed anything — which is exactly the day you most want to
# know. A PR gate would also be useless: the state it reads only changes when
# Googlebot next crawls, which is unrelated to when CI runs.
#
# WHY AN UNARMED CANARY IS RED, NOT GREEN (changed 2026-09-27):
# This shipped the other way. check-googlebot-access.ts exited 0 whenever no
# credential resolved, so a missing or rotated secret could not turn this red —
# deliberately, on the reasoning that a credential problem should not
# masquerade as a Googlebot problem, with the Report step below left to make a
# skip visible in the log. Then it was measured: GSC_SERVICE_ACCOUNT_JSON had
# never been added as a repository secret at all, and all 10 most recent runs
# reported success, every one of them a skip. The detector built because
# Googlebot was 403'd for five days had never once executed, and was green and
# silent about it — the same blind spot this workflow exists to close,
# reproduced one layer up. A log line nobody reads is not a signal.
# The script now exits NON-ZERO when no credential resolves and `CI` is set,
# and still skips quietly when a maintainer runs it by hand locally. Adding the
# secret is not the durable fix — this is: the next service-account rotation
# cannot silently re-disarm the canary, because unarmed no longer looks like
# passed. A credential that is PRESENT but malformed already failed in both
# environments and still does. The Report step still runs first, so the log
# names the cause before the failure line.
#
# SETUP (one-time): add a repository secret GSC_SERVICE_ACCOUNT_JSON holding
# the full JSON of a Google service account with read access to the
# sc-domain:compute-atlas.com Search Console property. Locally the same script
# reads ~/.config/gsc-mcp/service-account.json instead — where the GSC MCP
# server already keeps it — so `npm run check:googlebot` works with no setup.
name: Googlebot Access Canary

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC daily — clear of neon-sync (08:00), release-please (09:00 Mon), drift-alert (22:00), discovery-watchdog (23:00)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  googlebot-access:
    name: Verify Google is not being blocked
    runs-on: ubuntu-latest
    # ⛔ DO NOT hoist GSC_SERVICE_ACCOUNT_JSON back to a job-level `env:`. It
    # was one until 2026-09-27, defended here by the claim that "npm ci runs no
    # lifecycle scripts that could read it out". That claim was measured FALSE:
    # `npm ci` runs four install scripts on this runner (esbuild x3,
    # unrs-resolver), and a job-level env is handed to every one of them. The
    # value is a GCP service-account private key, so it belongs on the two
    # steps that actually read it and nowhere else — the same rule ci.yml
    # already states for DATABASE_URL. `--ignore-scripts` is NOT the
    # alternative: esbuild's install script is what prepares the platform
    # binary `tsx` needs to run this check at all.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # `[ -z ... ]` is a shell built-in test: it inspects the value without
      # printing it, so the private key never reaches the log.
      - name: Report whether the canary can actually run
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${GSC_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::warning::GSC_SERVICE_ACCOUNT_JSON is not set — the canary cannot run, so the next step will FAIL rather than skip (CI is set on every runner). Add the repository secret to arm it."
          else
            echo "Credential present; canary will run against sc-domain:compute-atlas.com."
          fi

      # No pipe, no tee: `npm run` is the last command, so its exit status is
      # the step's exit status. A pipeline here would report the exit code of
      # the pipe's final element and swallow a real failure — a trap this repo
      # has hit more than once.
      - name: Ask Google what it saw on its last crawl
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: npm run check:googlebot
