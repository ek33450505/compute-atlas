# Scheduled Neon→JSON export (daily, auto-PR).
#
# This workflow runs daily (08:00 UTC) to export the live Neon dataset back to
# data/facilities.json, keeping the published CC-BY snapshot in sync with prod
# approvals. The workflow:
#
# 1. Runs `npm run db:export` to regenerate data/facilities.json (+ metadata)
# 2. Checks if data/facilities.json has REAL content changes (ignores .meta.json)
# 3. If (and ONLY if) there is drift, runs `npm run build:mapdata` so the new
#    facilities get a data/siting-context.json entry — see below
# 4. Opens a pull request ONLY if there's drift (no spam on identical runs)
# 5. Branch: automated/neon-sync, base: main
#
# WHY build:mapdata IS PART OF THIS (added 2026-08-14):
# This workflow used to export facilities.json and nothing else, so
# data/siting-context.json was structurally outside the automation. A facility
# approved on prod therefore went live with NO "Siting context" panel — silently,
# no error — until a human happened to run build:mapdata by hand. That is the trap
# CLAUDE.md warns about (it once reached 65 of 934 records), and it was still live:
# atterix-raton-digital-hub-nm, green-data-socorro-county-nm and
# green-data-spaceport-america-sierra-county-nm (approved after the 2026-08-08 NM
# discovery run) sat SIX DAYS without siting context before a manual run backfilled
# them. The daily export could never have fixed that on its own.
#
# It is GATED on drift, not run unconditionally, because build:mapdata rewrites
# public/data/drought.geojson with a fresh `asOf` EVERY day. Ungated, this workflow
# would open a PR every single morning with no facility change behind it, and a
# daily noise PR is one you learn to ignore.
#
# It is FAIL-CLOSED: build:mapdata fetches external APIs (USGS NHD, HIFLD ArcGIS,
# USDM, WRI Aqueduct). A mid-run failure can leave a PARTIALLY written
# siting-context.json, which is worse than a stale one — it is exactly the
# `value -> null` data loss CLAUDE.md tells you to diff-read for. So on failure the
# generated artifacts are reverted and the PR opens with the facility files only,
# rather than committing a half-built context file.
#
# NOTE: The FIRST run after merge will produce a large one-time diff, as the
# hand-maintained JSON is canonicalized into the sorted form db:export uses.
# This is expected and accepted; subsequent runs will be incremental.
#
# Requires: DATABASE_URL as a repo secret (Settings → Secrets and variables → Actions).
# If not configured, the workflow skips gracefully.
#
# NEON_SYNC_PAT (REQUIRED, added 2026-09-03): a fine-grained PAT scoped to this
# repo only, owned by the maintainer, with THREE permissions — Contents,
# Pull requests, AND Workflows, all read/write. It is used as the PR-creation
# token instead of the default GITHUB_TOKEN, which changes real behavior:
# GitHub does not trigger `pull_request`-scoped workflows (ci.yml) off a
# GITHUB_TOKEN-authored PR (loop-prevention), but WILL trigger them off a
# PAT-authored one. With the PAT, this PR gets a real CI run, and
# `gh pr merge --auto` waits for those checks to pass before merging — it does
# not bypass branch protection, it satisfies it normally.
#
# ⛔ Workflows:read/write is NOT optional, and the `|| github.token` fallback
# below is NOT graceful — both were mis-stated here until 2026-09-05. Because
# `delete-branch: true` recreates `automated/neon-sync` from scratch on every
# run, each push creates a BRAND-NEW ref, and GitHub re-evaluates every commit
# reachable from a new ref as new to it. Any commit under .github/workflows/ in
# main's history therefore trips the workflow-scope check on every single run.
# Observed 2026-09-04 01:39, on the ordinary path, ten hours after
# drift-alert.yml had already merged to main:
#     ! [remote rejected] automated/neon-sync -> automated/neon-sync (refusing
#       to allow a GitHub App to create or update workflow
#       `.github/workflows/drift-alert.yml` without `workflows` permission)
# So without a PAT carrying Workflows, the push is rejected and NO PR OPENS AT
# ALL — the sync silently stops publishing rather than degrading to manual
# merge. The preflight step below catches a missing Contents:write, but cannot
# catch this; the only defence is granting all three permissions.

name: Neon→JSON Sync

on:
  schedule:
    - cron: "0 8 * * *"  # Daily 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Never run two exports concurrently — avoids racing auto-PRs onto the same branch.
concurrency:
  group: neon-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Export Neon to JSON
    runs-on: ubuntu-latest
    # Map the secret to a job-level env var so it can be tested in step `if:`
    # conditions — the `secrets` context is NOT available in `if:` expressions.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_SYNC_PAT: ${{ secrets.NEON_SYNC_PAT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # PAT WRITE PREFLIGHT — runs on EVERY run, drift or not, and FIRST, so a
      # dead credential costs seconds instead of the ~30min build:mapdata pass.
      #
      # WHY UNCONDITIONAL: the PAT is only ever exercised by the branch push
      # inside `Create PR if drift detected`, and that step is gated on drift.
      # A broken token is therefore invisible on every no-drift day and first
      # surfaces on the day there is finally data to publish — the day it costs
      # the most. That is exactly how the 2026-09-05 run failed: the secret was
      # rotated 2026-09-04 13:15 UTC, the verification run one minute later
      # found no drift and finished in 36s without ever touching the push path,
      # and the break stayed hidden until the next drift day, when the push
      # returned `remote: Permission to <repo> denied`. The rotation was never
      # actually tested, because the only thing that tests it is drift.
      #
      # WHAT A PASSING CHECK LOOKS LIKE WHILE THE BUG IS PRESENT: nothing does.
      # Against the broken token this step goes red with that same 403 — it
      # performs a real authenticated git-receive-pack handshake, which is the
      # operation that failed, not a proxy for one. `--dry-run` stops before
      # sending any objects, so the scratch ref is never actually created.
      #
      # HONEST LIMIT: this proves Contents:write only. It canNOT prove the
      # Workflows permission — see the `workflows` note in the header. A
      # preflight that pushes an already-present commit cannot reproduce that
      # rejection, so a token missing Workflows still passes this step and
      # still fails the real push.
      #
      # NEON_SYNC_PAT is a registered Actions secret, so its value is masked in
      # any git error line that echoes the remote URL back into the log.
      - name: Preflight — verify the PR token can still write
        if: env.NEON_SYNC_PAT != ''
        run: |
          set -euo pipefail
          if git push --dry-run \
            "https://x-access-token:${NEON_SYNC_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/neon-sync-write-preflight"; then
            echo "NEON_SYNC_PAT can write to ${GITHUB_REPOSITORY}."
          else
            echo "::error::NEON_SYNC_PAT cannot push to ${GITHUB_REPOSITORY}, so this sync cannot open its PR. Regenerate the fine-grained PAT scoped to this repo with Contents: read and write, Pull requests: read and write, and Workflows: read and write, then update the NEON_SYNC_PAT secret. Until it is fixed, prod approvals stay unpublished in data/facilities.json and every newly approved facility renders with no Siting context panel."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Run db:export
        if: env.DATABASE_URL != ''
        run: npx tsx scripts/export.ts

      - name: Check for real changes (ignore .meta.json)
        id: check-drift
        run: |
          if git diff --quiet -- data/facilities.json; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      # Only on drift — see the header note on daily drought.geojson churn.
      # continue-on-error so a flaky external API cannot block the facility sync.
      - name: Build map data (siting context + overlays)
        id: mapdata
        if: steps.check-drift.outputs.drift == 'true'
        continue-on-error: true
        run: npm run build:mapdata

      # FAIL-CLOSED: revert every build:mapdata output so a partially written
      # siting-context.json can never reach the PR. Paths here MUST stay in sync
      # with `add-paths` below — a path in one list but not the other reintroduces
      # exactly the gap this change exists to close. Authoritative output list is
      # the header of scripts/build-map-data.mjs.
      - name: Discard partial map data on failure
        if: steps.check-drift.outputs.drift == 'true' && steps.mapdata.outcome == 'failure'
        run: |
          echo "::error::build:mapdata FAILED — discarding partial artifacts. The PR will contain facility data only; data/siting-context.json will be STALE for any new facility until the next successful run or a manual 'npm run build:mapdata'."
          git checkout -- \
            data/siting-context.json \
            public/data/water.geojson \
            public/data/power.geojson \
            public/data/drought.geojson \
            public/data/water-stress.geojson \
            public/data/groundwater-decline.geojson \
            public/data/aquifers.geojson \
            public/data/map-layers.json \
            public/data/hero-points.json

      # Heredoc form of $GITHUB_OUTPUT, not `key=value`: the note contains
      # backticks, quotes and emoji, and key=value is single-line-only — a stray
      # newline there would silently truncate the value or corrupt the output file.
      # MAPDATA_OUTCOME goes through `env:` rather than being interpolated straight
      # into the script, so the expression can never be parsed as shell.
      - name: Note map-data status for the PR body
        id: mapnote
        if: steps.check-drift.outputs.drift == 'true'
        env:
          MAPDATA_OUTCOME: ${{ steps.mapdata.outcome }}
        run: |
          # shellcheck disable=SC2016  # single quotes are deliberate: the backticks
          # below are literal markdown for the PR body, not command substitution.
          {
            echo "note<<MAPNOTE_EOF"
            if [ "$MAPDATA_OUTCOME" = "failure" ]; then
              echo '⚠️ **build:mapdata FAILED this run** — map artifacts were discarded and are NOT in this PR. Any new facility here will render without its "Siting context" panel until a successful run or a manual `npm run build:mapdata`.'
            else
              echo '✅ Map data regenerated — `data/siting-context.json` and the `public/data/` overlays are included, so new facilities have their "Siting context" panel.'
            fi
            echo "MAPNOTE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create PR if drift detected
        if: steps.check-drift.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        id: create-pr
        with:
          # ⛔ NOT graceful degradation, despite the shape. This is a
          # last-resort fallback that is expected to FAIL: github.token cannot
          # push this branch at all while any commit under .github/workflows/
          # is reachable from the newly created ref — see the NEON_SYNC_PAT
          # note in the header for the mechanism and the observed rejection.
          # It is kept only so a PAT-less run fails at the push with GitHub's
          # own explicit error rather than an unset-token error.
          token: ${{ env.NEON_SYNC_PAT || github.token }}
          branch: automated/neon-sync
          base: main
          title: "chore(data): sync facilities.json with Neon"
          body: |
            Automated sync of `data/facilities.json` from live Neon dataset.

            This is a routine export triggered by the daily Neon→JSON sync workflow.
            Facilities are created/edited on prod, and this PR brings the published
            CC-BY snapshot back in sync.

            ${{ steps.mapnote.outputs.note }}

            **Checklist:**
            - [ ] Review data changes for accuracy
            - [ ] Confirm `data/siting-context.json` changes are ADDITIVE (a `value → null` is data loss, not a refresh)
            - [ ] Merge when ready
            - [ ] Post-merge, the next release can consume updated data
          delete-branch: true
          add-paths: |
            data/facilities.json
            data/facilities.meta.json
            data/siting-context.json
            public/data/water.geojson
            public/data/power.geojson
            public/data/drought.geojson
            public/data/water-stress.geojson
            public/data/groundwater-decline.geojson
            public/data/aquifers.geojson
            public/data/map-layers.json
            public/data/hero-points.json

      # Native GitHub auto-merge: merges once the PR's required checks report
      # success. Does NOT bypass branch protection — if the PAT isn't set (so
      # no CI ever runs on this PR) or a check genuinely fails, this call
      # schedules a merge that will simply never become eligible, and the PR
      # sits for manual attention exactly as it always has. Skipped entirely
      # when the PAT isn't configured, since there would be nothing for it to
      # wait on.
      #
      # ⛔ ALSO skipped when build:mapdata FAILED, and that clause is
      # load-bearing. On a mapdata failure the artifacts are discarded above and
      # the PR opens carrying facility data only, with a ⚠️ in its body saying
      # siting-context will be STALE for any new facility. That warning only
      # works if a human reads it — and auto-merge is precisely the thing that
      # removes the reader. Worse, it does not self-heal: the merge resolves the
      # `data/facilities.json` drift, so the next run's drift check finds
      # nothing, skips, and `data/siting-context.json` stays stale indefinitely
      # until someone runs `npm run build:mapdata` by hand. That is the
      # mechanism that left 65 of 934 records without a Siting context panel
      # (2026-08-08). Holding the PR open on failure restores the human read on
      # exactly the runs that need one, and costs nothing on a clean run.
      #
      # Use `outcome`, NOT `conclusion`: `continue-on-error: true` rewrites
      # `conclusion` to 'success' even when the step failed, so a `conclusion`
      # check here would silently never fire. Matches the two existing
      # `steps.mapdata.outcome` uses above.
      - name: Enable auto-merge
        if: >-
          steps.check-drift.outputs.drift == 'true'
          && env.NEON_SYNC_PAT != ''
          && steps.mapdata.outcome != 'failure'
        env:
          GH_TOKEN: ${{ env.NEON_SYNC_PAT }}
          # Env-var indirection rather than direct ${{ }} interpolation into the
          # shell line — the value is a trusted integer from create-pull-request,
          # but the pattern matches MAPDATA_OUTCOME above and GitHub's hardening
          # guidance, so no run: block interpolates an expression directly.
          SYNC_PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh pr merge "$SYNC_PR_NUMBER" --squash --auto
