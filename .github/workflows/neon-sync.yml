# Scheduled Neon→JSON export (daily, auto-PR).
#
# This workflow runs daily (08:00 UTC) to export the live Neon dataset back to
# data/facilities.json, keeping the published CC-BY snapshot in sync with prod
# approvals. The workflow:
#
# 1. Runs `npm run db:export` to regenerate data/facilities.json (+ metadata)
# 2. Checks if data/facilities.json has REAL content changes (ignores .meta.json)
# 3. If (and ONLY if) there is drift, runs `npm run build:mapdata` so the new
#    facilities get a data/siting-context.json entry — see below
# 4. Opens a pull request ONLY if there's drift (no spam on identical runs)
# 5. Branch: automated/neon-sync, base: main
#
# WHY build:mapdata IS PART OF THIS (added 2026-08-14):
# This workflow used to export facilities.json and nothing else, so
# data/siting-context.json was structurally outside the automation. A facility
# approved on prod therefore went live with NO "Siting context" panel — silently,
# no error — until a human happened to run build:mapdata by hand. That is the trap
# CLAUDE.md warns about (it once reached 65 of 934 records), and it was still live:
# atterix-raton-digital-hub-nm, green-data-socorro-county-nm and
# green-data-spaceport-america-sierra-county-nm (approved after the 2026-08-08 NM
# discovery run) sat SIX DAYS without siting context before a manual run backfilled
# them. The daily export could never have fixed that on its own.
#
# It is GATED on drift, not run unconditionally, because build:mapdata rewrites
# public/data/drought.geojson with a fresh `asOf` EVERY day. Ungated, this workflow
# would open a PR every single morning with no facility change behind it, and a
# daily noise PR is one you learn to ignore.
#
# It is FAIL-CLOSED with a fallback: build:mapdata fetches external APIs (USGS NHD,
# HIFLD ArcGIS, USDM, WRI Aqueduct). A mid-run failure can leave a PARTIALLY written
# siting-context.json, which is worse than a stale one — it is exactly the
# `value -> null` data loss CLAUDE.md tells you to diff-read for. On full-path failure
# (usually a degraded USGS NHD; any non-zero exit of the full pass triggers it) the
# workflow falls back to
# build:mapdata --skip-nhd (no NHD calls; water/power/drought overlays reused from prior
# state; Aqueduct + aquifer context refreshed), which is STRUCTURALLY additive and seeds
# an entry for every facility id. The NHD debt (new CONUS facilities missing
# nearestWater/nearestTransmission) is logged in data/nhd-backfill-debt.json and paid off
# by the nightly nhd-backfill.yml. If --skip-nhd also fails or its output is not additive,
# the artifacts are reverted and the PR opens with facility files only.
#
# NOTE: The FIRST run after merge will produce a large one-time diff, as the
# hand-maintained JSON is canonicalized into the sorted form db:export uses.
# This is expected and accepted; subsequent runs will be incremental.
#
# Requires: DATABASE_URL as a repo secret (Settings → Secrets and variables → Actions).
# If it is missing, the credential guard fails the run (closed) rather than skipping.
#
# NEON_SYNC_PAT (REQUIRED, added 2026-09-03): a fine-grained PAT scoped to this
# repo only, owned by the maintainer, with THREE permissions — Contents,
# Pull requests, AND Workflows, all read/write. It is used as the PR-creation
# token instead of the default GITHUB_TOKEN, which changes real behavior:
# GitHub does not trigger `pull_request`-scoped workflows (ci.yml) off a
# GITHUB_TOKEN-authored PR (loop-prevention), but WILL trigger them off a
# PAT-authored one. With the PAT, this PR gets a real CI run, and
# `gh pr merge --auto` waits for those checks to pass before merging — it does
# not bypass branch protection, it satisfies it normally.
#
# ⛔ Workflows:read/write is NOT optional — this was mis-stated until 2026-09-05.
# Because `delete-branch: true` recreates `automated/neon-sync` from scratch on
# every run, each push creates a BRAND-NEW ref, and GitHub re-evaluates every
# commit reachable from a new ref as new to it. Any commit under .github/workflows/
# in main's history therefore trips the workflow-scope check on every single run.
# Observed 2026-09-04 01:39, on the ordinary path, ten hours after drift-alert.yml
# had already merged to main:
#     ! [remote rejected] automated/neon-sync -> automated/neon-sync (refusing
#       to allow a GitHub App to create or update workflow
#       `.github/workflows/drift-alert.yml` without `workflows` permission)
# So without a PAT carrying Workflows, the push is rejected and NO PR OPENS AT
# ALL — the sync silently stops publishing rather than degrading to manual merge.
# The credential guard below fails the run closed when the PAT is missing, so no
# fallback is needed; all three permissions are required on the PAT.

name: Neon→JSON Sync

on:
  schedule:
    - cron: "0 8 * * *"  # Daily 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Never run two exports concurrently — avoids racing auto-PRs onto the same branch.
concurrency:
  group: neon-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Export Neon to JSON
    runs-on: ubuntu-latest
    # ⛔ These are BOOLEANS, not the secrets, and the distinction is the point.
    # Both secrets were job-level env vars until 2026-09-27, which handed them
    # to every step — including `npm ci`, which runs four package install
    # scripts on this runner (esbuild x3, unrs-resolver). That put the
    # production database URL and a repo-scoped write PAT in the environment of
    # four third-party scripts. Each secret is now on only the steps that read
    # it, which is the rule ci.yml already states for DATABASE_URL.
    #
    # They cannot simply be deleted from the job level: the `secrets` context is
    # NOT available in `if:` expressions, and three steps below gate on whether
    # a secret is set. `secrets.X != ''` is evaluated HERE, where secrets ARE
    # available, and only the `true`/`false` result is exported — so every guard
    # keeps its exact meaning while no step that does not need a value sees one.
    # `with:` and step `env:` CAN read `secrets` directly, so those use it.
    # Do not "simplify" this back into the secrets themselves.
    env:
      HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
      HAS_NEON_SYNC_PAT: ${{ secrets.NEON_SYNC_PAT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Do not persist github.token to .git/config — npm ci runs third-party
          # install scripts (esbuild x3, unrs-resolver) in this step, matching the
          # 2026-09-27 principle of keeping secrets away from third-party execution.

      # GUARD ON THE GUARDS, and unconditional. Three steps below gate on the
      # HAS_* booleans rendered at job level from `secrets.X != ''`. Both must be
      # 'true'. If either is 'false' (the secret is missing) or fails to render at
      # all, those steps SKIP — db:export never runs, the drift check finds
      # nothing, no PR opens, and the sync stops publishing while reporting
      # success. drift-alert.yml would catch that a day later; this catches it in
      # one second. It prints only booleans, never a secret value.
      #
      # ⚠️ WIDENED 2026-09-28. This step previously accepted 'false' as a valid
      # boolean and only rejected an unrenderable value — so a MISSING secret
      # sailed through the very guard whose error message names that outcome. The
      # two causes are still reported separately because their remedies differ:
      # "add the secret" vs "the expression stopped rendering".
      #
      # Failing on 'false' is safe here because the triggers are `schedule` and
      # `workflow_dispatch` only — there is no `pull_request` trigger, so no
      # fork-PR case where secrets are legitimately unavailable. Re-check that
      # before adding a trigger. NEON_SYNC_PAT is treated as equally fatal: Create PR
      # uses it with no github.token fallback (github.token could not push this branch
      # anyway — it lacks Workflows permission — and this job's GITHUB_TOKEN is now
      # read-only).
      #
      # All four paths exercised under `bash -e` before merge: both-true exits 0,
      # each 'false' and an unrenderable value each exit 1 naming the cause.
      - name: Verify both credentials are present and rendered
        run: |
          bad=""
          msg_db=""
          msg_pat=""

          case "$HAS_DATABASE_URL" in
            true) ;;
            false) msg_db="DATABASE_URL secret is missing or empty" ;;
            *) msg_db="expression failed to render as a boolean (value='$HAS_DATABASE_URL')" ;;
          esac
          [ -n "$msg_db" ] && bad="${bad}${bad:+; }HAS_DATABASE_URL: $msg_db"

          case "$HAS_NEON_SYNC_PAT" in
            true) ;;
            false) msg_pat="NEON_SYNC_PAT secret is missing or empty" ;;
            *) msg_pat="expression failed to render as a boolean (value='$HAS_NEON_SYNC_PAT')" ;;
          esac
          [ -n "$msg_pat" ] && bad="${bad}${bad:+; }HAS_NEON_SYNC_PAT: $msg_pat"

          if [ -n "$bad" ]; then
            echo "::error::Credential guard FAILED: $bad. Every step gated on these would SKIP and this workflow would report success having published nothing. Failing closed."
            exit 1
          fi
          echo "Credential guards: HAS_DATABASE_URL=$HAS_DATABASE_URL HAS_NEON_SYNC_PAT=$HAS_NEON_SYNC_PAT"

      # PAT WRITE PREFLIGHT — runs on EVERY run, drift or not, and FIRST, so a
      # dead credential costs seconds instead of the ~30min build:mapdata pass.
      #
      # WHY UNCONDITIONAL: the PAT is only ever exercised by the branch push
      # inside `Create PR if drift detected`, and that step is gated on drift.
      # A broken token is therefore invisible on every no-drift day and first
      # surfaces on the day there is finally data to publish — the day it costs
      # the most. That is exactly how the 2026-09-05 run failed: the secret was
      # rotated 2026-09-04 13:15 UTC, the verification run one minute later
      # found no drift and finished in 36s without ever touching the push path,
      # and the break stayed hidden until the next drift day, when the push
      # returned `remote: Permission to <repo> denied`. The rotation was never
      # actually tested, because the only thing that tests it is drift.
      #
      # WHAT A PASSING CHECK LOOKS LIKE WHILE THE BUG IS PRESENT: nothing does.
      # Against the broken token this step goes red with that same 403 — it
      # performs a real authenticated git-receive-pack handshake, which is the
      # operation that failed, not a proxy for one. `--dry-run` stops before
      # sending any objects, so the scratch ref is never actually created.
      #
      # HONEST LIMIT: this proves Contents:write only. It canNOT prove the
      # Workflows permission — see the `workflows` note in the header. A
      # preflight that pushes an already-present commit cannot reproduce that
      # rejection, so a token missing Workflows still passes this step and
      # still fails the real push.
      #
      # NEON_SYNC_PAT is a registered Actions secret, so its value is masked in
      # any git error line that echoes the remote URL back into the log.
      - name: Preflight — verify the PR token can still write
        if: env.HAS_NEON_SYNC_PAT == 'true'
        env:
          NEON_SYNC_PAT: ${{ secrets.NEON_SYNC_PAT }}
        run: |
          set -euo pipefail
          if git push --dry-run \
            "https://x-access-token:${NEON_SYNC_PAT}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/neon-sync-write-preflight"; then
            echo "NEON_SYNC_PAT can write to ${GITHUB_REPOSITORY}."
          else
            echo "::error::NEON_SYNC_PAT cannot push to ${GITHUB_REPOSITORY}, so this sync cannot open its PR. Regenerate the fine-grained PAT scoped to this repo with Contents: read and write, Pull requests: read and write, and Workflows: read and write, then update the NEON_SYNC_PAT secret. Until it is fixed, prod approvals stay unpublished in data/facilities.json and every newly approved facility renders with no Siting context panel."
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Run db:export
        if: env.HAS_DATABASE_URL == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/export.ts

      - name: Check for real changes (ignore .meta.json)
        id: check-drift
        run: |
          if git diff --quiet -- data/facilities.json; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      # Only on drift — see the header note on daily drought.geojson churn.
      # continue-on-error so a flaky external API cannot block the facility sync.
      - name: Build map data (siting context + overlays)
        id: mapdata
        if: steps.check-drift.outputs.drift == 'true'
        continue-on-error: true
        run: npm run build:mapdata

      # FALLBACK WHEN THE FULL PASS FAILS (added 2026-10-04: every daytime dispatch
      # 2026-09-25 → 10-02 failed the NHD pre-flight, 6/6). The usual cause is a
      # degraded USGS NHD (12s timeouts, HTTP 502), which aborts at the pre-flight
      # before any work; any other non-zero exit of the full pass (for example an
      # HIFLD paging mismatch) also lands here. This fallback runs
      # build:mapdata --skip-nhd: no NHD calls; water/power/drought overlays reused
      # from prior state; Aqueduct + aquifer context still fetched — so a WRI
      # Aqueduct or USGS aquifer outage fails this step too, and the Discard step
      # then holds the PR for a human. STRUCTURALLY additive (merges
      # {...existing[id], ...envContext[id]}), seeds an entry for every facility id,
      # and regenerates hero-points.json, hero-plate-paths.ts and
      # pipeline-history.json. New CONUS facilities lack nearestWater/
      # nearestTransmission (NHD debt), recorded in data/nhd-backfill-debt.json for
      # the nightly nhd-backfill.yml to pay off. This step reverts the artifacts
      # first so it starts from the committed state.
      - name: Fall back to build:mapdata --skip-nhd
        id: mapdata_fallback
        if: steps.check-drift.outputs.drift == 'true' && steps.mapdata.outcome == 'failure'
        continue-on-error: true
        run: |
          set -euo pipefail
          git checkout -- \
            data/siting-context.json \
            public/data/water.geojson \
            public/data/power.geojson \
            public/data/drought.geojson \
            public/data/water-stress.geojson \
            public/data/groundwater-decline.geojson \
            public/data/aquifers.geojson \
            public/data/map-layers.json \
            public/data/hero-points.json \
            public/data/pipeline-history.json \
            components/home/hero-plate-paths.ts
          npm run build:mapdata -- --skip-nhd

      # Resolve which map-data build path succeeded (full, fallback, or neither).
      # Pass outcomes through env (never interpolate ${{ }} directly into run: —
      # this keeps the expression opaque to the shell).
      - name: Resolve map-data path
        id: mappath
        if: steps.check-drift.outputs.drift == 'true'
        env:
          MAPDATA_OUTCOME: ${{ steps.mapdata.outcome }}
          MAPDATA_FALLBACK_OUTCOME: ${{ steps.mapdata_fallback.outcome }}
        run: |
          if [ "$MAPDATA_OUTCOME" = "success" ]; then
            echo "path=full" >> "$GITHUB_OUTPUT"
          elif [ "$MAPDATA_FALLBACK_OUTCOME" = "success" ]; then
            echo "path=skip-nhd" >> "$GITHUB_OUTPUT"
          else
            echo "path=none" >> "$GITHUB_OUTPUT"
          fi

      # ADDITIVE GUARD — the machine half of a gate that was never actually run.
      #
      # The PR body has always carried "Confirm data/siting-context.json changes
      # are ADDITIVE (a `value → null` is data loss, not a refresh)". This PR
      # auto-merges, so no human has ever read that checkbox. This step performs
      # it, and it is the reason auto-merge can stay on.
      #
      # It is NOT redundant with the maintainer's approval. Approval happens in
      # /admin BEFORE this build runs and vouches for the DATA. This vouches for
      # the ARTIFACT — whether USGS NHD / HIFLD / WRI Aqueduct degraded during
      # the ~27min rebuild. A pre-build click cannot approve a post-build
      # artifact, so the two gates are not interchangeable.
      #
      # BASELINE IS origin/main, NOT THE CHECKED-OUT HEAD. The rebuild takes
      # ~30 min, so anything merged during it leaves this job's HEAD stale and a
      # recomputation that is CORRECT for the new state reads as data loss. That
      # cost a false positive on 2026-09-08 (run 34227078474): the job started
      # 12:36:57Z on 11f9d13, #256 merged 12:50:24Z moving two Salt Lake City
      # facilities off a shared placeholder centroid onto real coordinates, and
      # at 13:09:08Z this step flagged their recomputed groundwaterDecline as
      # dropped — the old values had been computed at a fabricated coordinate.
      # The script fetches origin/main itself; if that fails it falls back to
      # HEAD, which is at-or-behind origin/main and therefore STRICTER, never
      # more permissive. See scripts/check-siting-additive.mjs.
      #
      # WHY THE EXISTING CIRCUIT BREAKER IS NOT ENOUGH: build-map-data.mjs aborts
      # only after NHD_CONSECUTIVE_FAILURE_BUDGET (10) CONSECUTIVE facilities
      # fail BOTH NHD layers, so a SCATTERED partial outage exits 0. Since #347
      # (2026-09-25) `resolveNearestWater` carries a prior `nearestWater` forward
      # on any unconfirmed failure (only a confirmed absence clears it), so this
      # step is now a backstop against a regression in that logic, not the only
      # thing standing between an outage and lost values. (This comment formerly
      # said "nothing preserves the prior value" — false once carry-forward
      # landed; see the CORRECTION in CLAUDE.md.)
      #
      # WHAT A PASSING CHECK LOOKS LIKE WHILE THE BUG IS PRESENT: it does not
      # pass. Probed by planting a violation 2026-09-05 — one dropped field, one
      # nulled field, one removed entry — and the script exited 1 naming all
      # three with their old values. On the same day's real run, three transient
      # NHD HTTP 502s still produced 1355→1384, +29 added, 0 lost, 0 nulled: the
      # mechanism is real and that day's blast radius was zero, which is exactly
      # the difference this step makes visible instead of assumed.
      #
      # A removed entry whose facility is also absent from data/facilities.json
      # (a retirement's orphan, pruned by any non --skip-nhd run) is reported as
      # `pruned` and does not fail this step.
      #
      # continue-on-error so the failure is HANDLED (discard + hold the PR open)
      # rather than aborting the job and leaving no PR at all.
      - name: Verify siting-context changes are additive
        id: additive
        if: steps.check-drift.outputs.drift == 'true' && steps.mappath.outputs.path != 'none'
        continue-on-error: true
        run: node scripts/check-siting-additive.mjs

      # Update the NHD debt ledger (data/nhd-backfill-debt.json) if a map-data
      # build succeeded and was verified as additive. The ledger tracks which
      # facilities are missing nearestWater/nearestTransmission entries (CONUS only,
      # non-CONUS facilities legitimately have no NHD match). This count is compared
      # by CI against expected debt, so it cannot grow silently. The nightly
      # nhd-backfill.yml pays off this debt.
      - name: Update NHD debt ledger
        id: debt
        if: steps.check-drift.outputs.drift == 'true' && steps.mappath.outputs.path != 'none' && steps.additive.outcome == 'success'
        continue-on-error: true
        env:
          MAP_PATH: ${{ steps.mappath.outputs.path }}
        run: |
          set -euo pipefail
          npx tsx scripts/update-nhd-debt.ts --note "neon-sync ${MAP_PATH} run ${GITHUB_RUN_ID}"
          count=$(npx tsx scripts/update-nhd-debt.ts --count)
          if ! [[ "$count" =~ ^[0-9]+$ ]]; then echo "::error::NHD debt count is not a valid integer: '$count'."; exit 1; fi
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # FAIL-CLOSED: revert every build:mapdata output so a partially written
      # siting-context.json can never reach the PR. Paths here MUST stay in sync
      # with `add-paths` below — a path in one list but not the other reintroduces
      # exactly the gap this change exists to close. Authoritative output list is
      # the header of scripts/build-map-data.mjs.
      #
      # Fires when: both full and fallback failed, OR a build succeeded but output
      # was not additive, OR the debt ledger update failed.
      - name: Discard generated map data on failure
        if: >-
          steps.check-drift.outputs.drift == 'true'
          && (steps.mappath.outputs.path == 'none' || steps.additive.outcome == 'failure' || steps.debt.outcome == 'failure')
        env:
          MAPPATH: ${{ steps.mappath.outputs.path }}
          ADDITIVE_OUTCOME: ${{ steps.additive.outcome }}
          DEBT_OUTCOME: ${{ steps.debt.outcome }}
        run: |
          if [ "$MAPPATH" = "none" ]; then
            echo "::error::Both build:mapdata (full) and build:mapdata --skip-nhd failed — discarding artifacts. The PR will contain facility data only; data/siting-context.json will be STALE for any new facility until the next successful run or a manual build."
          elif [ "$ADDITIVE_OUTCOME" = "failure" ]; then
            echo "::error::build:mapdata output was NOT additive — it dropped or nulled siting-context fields that exist at HEAD (the step above names them). Discarding the regenerated artifacts rather than publishing data loss; data/siting-context.json will be STALE for any new facility until a clean rerun."
          elif [ "$DEBT_OUTCOME" = "failure" ]; then
            echo "::error::NHD debt ledger update failed — discarding artifacts to avoid committing an incomplete debt record. The PR will contain facility data only."
          fi
          git checkout -- \
            data/siting-context.json \
            data/nhd-backfill-debt.json \
            public/data/water.geojson \
            public/data/power.geojson \
            public/data/drought.geojson \
            public/data/water-stress.geojson \
            public/data/groundwater-decline.geojson \
            public/data/aquifers.geojson \
            public/data/map-layers.json \
            public/data/hero-points.json \
            public/data/pipeline-history.json \
            components/home/hero-plate-paths.ts

      # Heredoc form of $GITHUB_OUTPUT, not `key=value`: the note contains
      # backticks, quotes and emoji, and key=value is single-line-only — a stray
      # newline there would silently truncate the value or corrupt the output file.
      # Outcomes go through `env:` rather than being interpolated straight into
      # the script, so expressions can never be parsed as shell.
      - name: Note map-data status for the PR body
        id: mapnote
        if: steps.check-drift.outputs.drift == 'true'
        env:
          MAPPATH: ${{ steps.mappath.outputs.path }}
          ADDITIVE_OUTCOME: ${{ steps.additive.outcome }}
          DEBT_OUTCOME: ${{ steps.debt.outcome }}
          DEBT_COUNT: ${{ steps.debt.outputs.count }}
        run: |
          # shellcheck disable=SC2016  # single quotes are deliberate: the backticks
          # below are literal markdown for the PR body, not command substitution.
          {
            echo "note<<MAPNOTE_EOF"
            if [ "$MAPPATH" = "none" ]; then
              echo '⛔ **Both build:mapdata (full) and build:mapdata --skip-nhd failed** — map artifacts were discarded and are NOT in this PR. Any new facility here will render without its "Siting context" panel until a successful run or a manual `npm run build:mapdata`.'
            elif [ "$ADDITIVE_OUTCOME" = "failure" ]; then
              echo '⛔ **build:mapdata output was NOT additive** — it dropped or nulled `data/siting-context.json` fields that exist on `main`, so the regenerated artifacts were discarded and are NOT in this PR. This usually means a transient USGS NHD / HIFLD / WRI outage during the rebuild. Auto-merge is disabled for this PR: read the "Verify siting-context changes are additive" step for the exact ids, then rerun the workflow once the upstream service is healthy.'
            elif [ "$DEBT_OUTCOME" = "failure" ]; then
              echo '⛔ **NHD debt ledger update failed** — the regenerated map artifacts were discarded and are NOT in this PR to avoid committing an incomplete debt record. Auto-merge is disabled: rerun the workflow once the ledger operation succeeds.'
            elif [ "$MAPPATH" = "full" ]; then
              echo '✅ Map data regenerated — `data/siting-context.json` and the `public/data/` overlays are included, so new facilities have their "Siting context" panel.'
            elif [ "$MAPPATH" = "skip-nhd" ]; then
              echo "⚠️ **The full map-data pass failed (usually a degraded USGS NHD)** — map data was rebuilt with \`--skip-nhd\` (no NHD calls; water/power/drought overlays reused; Aqueduct + aquifer context still refreshed). Every facility has a Siting context entry, but new CONUS facilities lack \`nearestWater\` and \`nearestTransmission\`. NHD debt is now $DEBT_COUNT (recorded in \`data/nhd-backfill-debt.json\`), and the nightly \`nhd-backfill.yml\` fills it off-peak."
            fi
            echo "MAPNOTE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create PR if drift detected
        if: steps.check-drift.outputs.drift == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: create-pr
        with:
          # The credential guard fails the run closed when the PAT is missing, and
          # the preflight when it cannot write, so no fallback is needed.
          token: ${{ secrets.NEON_SYNC_PAT }}
          branch: automated/neon-sync
          base: main
          title: "chore(data): sync facilities.json with Neon"
          body: |
            Automated sync of `data/facilities.json` from live Neon dataset.

            This is a routine export triggered by the daily Neon→JSON sync workflow.
            Facilities are created/edited on prod, and this PR brings the published
            CC-BY snapshot back in sync.

            ${{ steps.mapnote.outputs.note }}

            **Checklist:**
            - [ ] Review data changes for accuracy
            - [ ] Confirm `data/siting-context.json` changes are ADDITIVE (a `value → null` is data loss, not a refresh)
            - [ ] Merge when ready
            - [ ] Post-merge, the next release can consume updated data
          delete-branch: true
          add-paths: |
            data/facilities.json
            data/facilities.meta.json
            data/siting-context.json
            data/nhd-backfill-debt.json
            public/data/water.geojson
            public/data/power.geojson
            public/data/drought.geojson
            public/data/water-stress.geojson
            public/data/groundwater-decline.geojson
            public/data/aquifers.geojson
            public/data/map-layers.json
            public/data/hero-points.json
            public/data/pipeline-history.json
            components/home/hero-plate-paths.ts

      # Native GitHub auto-merge: merges once the PR's required checks report
      # success. Does NOT bypass branch protection — if the PAT isn't set (so
      # no CI ever runs on this PR) or a check genuinely fails, this call
      # schedules a merge that will simply never become eligible, and the PR
      # sits for manual attention exactly as it always has. Skipped entirely
      # when the PAT isn't configured, since there would be nothing for it to
      # wait on.
      #
      # ⛔ ALSO skipped when BOTH the full path and the fallback fail, or when
      # the additive/debt checks fail. On double failure the artifacts are
      # discarded and the PR opens carrying facility data only, with a ⛔ in
      # its body saying siting-context is STALE or both builds failed. That
      # warning only works if a human reads it — and auto-merge is precisely
      # the thing that removes the reader. Worse, it does not self-heal: the
      # merge resolves the `data/facilities.json` drift, so the next run's drift
      # check finds nothing, skips, and `data/siting-context.json` stays stale
      # indefinitely until someone runs `npm run build:mapdata` by hand. That is
      # the mechanism that left 65 of 934 records without a Siting context panel
      # (2026-08-08).
      #
      # A --skip-nhd fallback DOES NOT trigger this hold: every id gets an entry
      # (additive by design), the debt is recorded in the ledger (which a CI ratchet
      # test compares against data to prevent silent growth), and nhd-backfill.yml
      # (monitored by automation-health) pays it down off-peak, so it self-heals
      # and auto-merge is safe.
      #
      # Use `outcome`, NOT `conclusion`: `continue-on-error: true` rewrites
      # `conclusion` to 'success' even when the step failed, so a `conclusion`
      # check here would silently never fire. Same rule as every other
      # continue-on-error step in this file.
      - name: Enable auto-merge
        if: >-
          steps.check-drift.outputs.drift == 'true'
          && env.HAS_NEON_SYNC_PAT == 'true'
          && steps.mappath.outputs.path != 'none'
          && steps.additive.outcome == 'success'
          && steps.debt.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.NEON_SYNC_PAT }}
          # Env-var indirection rather than direct ${{ }} interpolation into the
          # shell line — the value is a trusted integer from create-pull-request,
          # but the pattern matches MAPDATA_OUTCOME above and GitHub's hardening
          # guidance, so no run: block interpolates an expression directly.
          SYNC_PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh pr merge "$SYNC_PR_NUMBER" --squash --auto
