# Fails loudly if JSON<->Neon drift is STILL present late in the day — the
# signal that the daily sync chain (neon-sync.yml) did not converge today.
#
# WHY A SEPARATE WORKFLOW, NOT A BLOCKING STEP ON EVERY PR:
# Drift is normal and expected for hours after every prod approval — Neon
# updates the instant a maintainer approves a submission or runs db:sync
# --apply, and the committed JSON only catches up on the next sync cycle.
# Making check:drift blocking on every PR would turn every unrelated PR red
# for up to ~45h after a routine, correct prod approval (measured 2026-09-03:
# neon-sync's cron itself runs 0.3-11.9h after its nominal 08:00 UTC trigger,
# then whatever the merge lag adds on top). That punishes unrelated work for
# a lag that has nothing to do with it — see ci.yml's existing
# `check:drift (informational)` job for the same reasoning applied per-PR.
#
# So this runs on its OWN schedule, well after neon-sync's worst observed
# start time (08:00 UTC + up to 11.9h ~= 19:54 UTC) plus room for that run's
# own ~20min build:mapdata pass and PR merge to land. If drift STILL exists
# by then, the automation chain itself broke — that is what deserves a red X
# and GitHub's default failure notification, not the mere existence of drift.
#
# check-neon-drift.ts is deliberately non-blocking (always exits 0, see its
# own header) so other callers of `npm run check:drift` keep that contract.
# This workflow does NOT change that script; it classifies its output instead,
# so the shared drift detector stays exactly as advisory as it already was.
# That exit-0-always contract is what makes a non-zero exit here a reliable
# signal that the detector could not run at all.
#
# The greps below intentionally omit the leading "✓ " — grep -q performs an
# unanchored substring search, so they match the full line regardless; kept
# without the glyph so the patterns stay plain ASCII in this file.
#
# THIS WORKFLOW FAILED ALL SIX OF ITS FIRST RUNS (2026-09-03 .. 2026-09-08)
# and every one of those failures reported the wrong cause. Two independent
# defects, both now fixed below: it invoked the detectors through npm scripts
# carrying `--env-file=.env.local` (absent on a runner → node exit 9, before
# any DB connection), and it collapsed "the detector could not run" into
# "drift is present". Read the step comments before editing either.
name: Neon Drift Alert

on:
  schedule:
    - cron: "0 22 * * *"  # 22:00 UTC — past neon-sync's worst observed convergence time
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  drift-check:
    name: Verify today's sync converged
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # UNCONDITIONAL, and the first thing that runs. Every step below is
      # gated on `env.DATABASE_URL != ''`, so without this guard an unset or
      # empty secret SKIPS all of them and the job finishes GREEN having
      # verified nothing at all — a silent pass on the exact condition this
      # workflow exists to detect. That is the same fail-open shape as the
      # six-night failure this file was just fixed for, one layer up, so it
      # is closed here rather than left as the next thing to discover.
      #
      # Failing closed is right for this workflow specifically: it runs only
      # on `schedule` and `workflow_dispatch` in this repo, where the secret
      # is configured. A fork lacking the secret SHOULD fail loudly rather
      # than report a drift check it never performed.
      #
      # The per-step `if: env.DATABASE_URL != ''` conditions below are now
      # unreachable-when-empty and kept only as defence in depth — do not
      # read them as "skipping is acceptable".
      - name: Verify DATABASE_URL is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not configured or is empty, so NOTHING below can run. Failing closed: a drift alert that verified nothing must never report success. Set the DATABASE_URL repository secret (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          echo "DATABASE_URL is configured."

      # Runs BEFORE the JSON drift check, and with continue-on-error, so both
      # kinds of drift are reported in one run rather than the first failure
      # hiding the second. Schema drift is the more urgent of the two: a
      # missing table means shipped code is silently inert.
      #
      # Invoked as `npx tsx <script>` rather than the `check:schema` npm script,
      # matching ci.yml:76, neon-sync.yml:147 and discovery-watchdog.yml:81. The
      # npm script carries `--env-file=.env.local`, which does not exist on a
      # runner: node aborts with `node: .env.local: not found` and exit 9 BEFORE
      # opening a database connection. This workflow shipped with the npm form
      # and failed all 6 of its runs (2026-09-03 .. 2026-09-08) for that reason
      # alone, while reporting a missing production table. DATABASE_URL arrives
      # from the job env above.
      - name: Check deployed schema matches code
        if: env.DATABASE_URL != ''
        id: schema
        continue-on-error: true
        run: npx tsx scripts/check-schema-drift.ts

      # THREE outcomes, not two. The original form asked one question ("does the
      # output contain the success line?") and treated every other answer as
      # "drift is present" — so a detector that never ran read identically to
      # real drift. It could also never report at all: `OUTPUT="$(...)"` as the
      # first command under `bash -e` aborts the whole step on a non-zero exit,
      # so `converged=false` was never written and BOTH the stuck-PR report and
      # the drift failure below were SKIPPED. The alert failed open on precisely
      # the condition it exists to catch.
      #
      # The classification rules live in scripts/classify-drift-output.sh, NOT
      # inline here, so they can be tested: tests/workflows/run.bats drives all
      # five real fixtures (including the verbatim 2026-09-08 crash output)
      # through the same script this step calls. Logic embedded in a YAML `run:`
      # block cannot be exercised without dispatching the workflow, which is
      # how the original one-grep version shipped broken and stayed broken.
      #
      # rc is captured the instant the command returns and echoed as a plain
      # command — never through a pipe, which would report the pipe's status
      # instead (see the drift-alert postmortem and CLAUDE.md's note on `tee`).
      - name: Check JSON <-> Neon drift
        if: env.DATABASE_URL != ''
        id: drift
        run: |
          set +e
          OUTPUT="$(npx tsx scripts/check-neon-drift.ts 2>&1)"
          rc=$?
          set -e
          echo "$OUTPUT"
          echo "drift detector exit code: $rc"
          STATE="$(printf '%s\n' "$OUTPUT" | scripts/classify-drift-output.sh "$rc")"
          echo "classified state: $STATE"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

      # Only for REAL drift. A broken detector has no sync PR to blame, and
      # naming one would point the reader at the wrong thing entirely.
      - name: Report a stuck sync PR, if one exists
        if: env.DATABASE_URL != '' && steps.drift.outputs.state == 'drifted'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --head automated/neon-sync --state open \
            --json number,createdAt,url \
            --jq '.[] | "::error::Open unmerged sync PR #\(.number), opened \(.createdAt): \(.url)"' \
            || true

      - name: Fail if not converged
        if: env.DATABASE_URL != '' && steps.drift.outputs.state == 'drifted'
        run: |
          echo "::error::JSON<->Neon drift is still present past the daily sync's expected convergence window. See the drift output above and docs/architecture (or npm run check:drift locally) to diagnose."
          exit 1

      # A SEPARATE failure from real drift, deliberately worded so the two can
      # never be confused again. This is the state the workflow spent its first
      # six runs in while claiming a production table was missing.
      - name: Fail if the drift detector could not run
        if: always() && env.DATABASE_URL != '' && steps.drift.outputs.state == 'detector-broken'
        run: |
          echo "::error::The JSON<->Neon drift detector did not run to completion, so THIS WORKFLOW LEARNED NOTHING about drift today. This is not a report that drift exists — it is the absence of a report. Read the detector output above for the cause (a non-zero exit means the script could not start; a '::notice::drift check errored' line means it started but could not reach Neon)."
          exit 1

      # `always()` is load-bearing, not decoration: the steps above exit 1
      # without continue-on-error, which would otherwise skip every later step
      # — so a JSON drift failure would silently mask a schema drift failure,
      # the exact masking this ordering exists to prevent.
      #
      # The message states what FAILED, not what it believes the cause to be.
      # check-schema-drift.ts exits 1 for three different reasons — missing
      # tables, an unset DATABASE_URL, and an unreachable database — and the
      # previous wording asserted the first as fact for all three. On
      # 2026-09-08 the real cause was that node never started, and this step
      # nonetheless reported a missing production table. The script's own
      # output distinguishes the cases correctly; defer to it.
      - name: Fail if the deployed schema check did not pass
        if: always() && env.DATABASE_URL != '' && steps.schema.outcome == 'failure'
        run: |
          echo "::error::The deployed-schema check failed — read its output above for which of these it was. If it names missing tables, a migration reached main but was never applied: fix with 'npm run db:migrate' against production, then re-run this workflow. If it reports an unset or unreachable DATABASE_URL, the schema was NOT verified either way."
          echo "::error::Missing tables are the failure mode that silently disabled the daily API cap on 2026-09-03. Nothing caught it: CI was green, the deploy succeeded, and every public API route kept returning 200 while the gate failed open on every request."
          exit 1
